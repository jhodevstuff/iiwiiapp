<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IIWII - Capture what matters</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #1d1d1f 0%, #000 100%);
            color: #fff;
            text-align: center;
            padding: 40px 20px;
        }
        .logo {
            font-size: 64px;
            font-weight: 700;
            letter-spacing: -2px;
            margin-bottom: 8px;
        }
        .tagline {
            font-size: 20px;
            color: rgba(255,255,255,0.6);
            margin-bottom: 48px;
        }
        .links {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            justify-content: center;
        }
        a {
            color: #fff;
            text-decoration: none;
            padding: 12px 24px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 24px;
            font-size: 15px;
            transition: all 0.2s;
        }
        a:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.5);
        }
        .footer {
            position: absolute;
            bottom: 40px;
            color: rgba(255,255,255,0.4);
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="logo">IIWII</div>
    <div class="tagline">Capture what matters</div>

    <div class="links">
        <a href="support.html">Support</a>
        <a href="privacy-policy.html">Privacy Policy</a>
    </div>

    <div class="footer">
        IT IS WHAT IT IS
    </div>
</body>
</html>
